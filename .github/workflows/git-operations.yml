name: Git Operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operation to perform'
        required: true
        type: choice
        options:
          - create
          - remove
          - protect
          - unprotect
        default: 'create'

      branch_name:
        description: 'Branch name to create or remove'
        required: true
        type: string

      base_branch:
        description: 'Base branch to create from (for create operation)'
        required: false
        type: string
        default: 'develop'

      branding:
        description: 'Branding name'
        required: false
        type: string
        default: 'onlyoffice'

      branding_url:
        description: 'Branding repository URL (relative to git host)'
        required: false
        type: string
        default: 'ONLYOFFICE/onlyoffice.git'

      modules:
        description: 'Modules to include'
        required: false
        type: string
        default: 'core desktop builder server mobile'

      teams:
        description: 'Comma-separated teams for branch protection whitelist (for protect operation)'
        required: false
        type: string

jobs:
  git-operations:
    runs-on: ubuntu-latest
    env:
      GITEA_URL:  ${{ vars.GITEA_URL || github.server_url }}
      GIT_TOKEN:  ${{ secrets.TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: ONLYOFFICE/build_tools
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Git Operations
        env:
          OPERATION:   ${{ inputs.operation }}
          BRANCH_NAME: ${{ inputs.branch_name }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          BRANDING:    ${{ inputs.branding }}
          BRANDING_URL: ${{ inputs.branding_url }}
          MODULES:     ${{ inputs.modules }}
          TEAMS:       ${{ inputs.teams }}
        run: |
          cd ONLYOFFICE/build_tools/scripts/develop
          EXTRA_ARGS=""
          if [ "$OPERATION" = "protect" ] && [ -n "$TEAMS" ]; then
            EXTRA_ARGS="--teams=$TEAMS"
          fi
          python git_operations.py "$OPERATION" "$BRANCH_NAME" \
            --base-branch="$BASE_BRANCH" \
            --branding="$BRANDING" \
            --branding-url="$BRANDING_URL" \
            --modules="$MODULES" \
            $EXTRA_ARGS

      - name: Operation Summary
        run: |
          echo "## Git Operations Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Operation**: ${{ inputs.operation }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch Name**: ${{ inputs.branch_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Base Branch**: ${{ inputs.base_branch }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branding**: ${{ inputs.branding }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Modules**: ${{ inputs.modules }}" >> $GITHUB_STEP_SUMMARY
