name: Git Operations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Operation to perform'
        required: true
        type: choice
        options:
          - create
          - remove
          - merge
          - rename
          - protect
          - unprotect
        default: 'create'

      branch_name:
        description: 'Branch name to create, remove, merge from, or rename'
        required: true
        type: string

      base_branch:
        description: 'Base branch to create from, merge into, or rename to'
        required: false
        type: string
        default: 'develop'

      branding:
        description: 'Branding name'
        required: false
        type: string
        default: 'onlyoffice'

      branding_url:
        description: 'Branding repository URL (relative to git host)'
        required: false
        type: string
        default: 'ONLYOFFICE/onlyoffice.git'

      modules:
        description: 'Modules to include'
        required: false
        type: string
        default: 'core desktop builder server mobile'

      teams:
        description: 'Comma-separated teams for branch protection whitelist (for protect operation)'
        required: false
        type: string

jobs:
  git-operations:
    runs-on: ubuntu-latest
    env:
      GITEA_URL:  ${{ vars.GITEA_URL || github.server_url }}
      GIT_TOKEN:  ${{ secrets.TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: ONLYOFFICE/build_tools
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Run Git Operations
        env:
          OPERATION:   ${{ inputs.operation }}
          BRANCH_NAME: ${{ inputs.branch_name }}
          BASE_BRANCH: ${{ inputs.base_branch }}
          BRANDING:    ${{ inputs.branding }}
          BRANDING_URL: ${{ inputs.branding_url }}
          MODULES:     ${{ inputs.modules }}
          TEAMS:       ${{ inputs.teams }}
        run: |
          cd ONLYOFFICE/build_tools/scripts/develop
          EXTRA_ARGS=""
          if [ "$OPERATION" = "protect" ] && [ -n "$TEAMS" ]; then
            EXTRA_ARGS="--teams=$TEAMS"
          fi
          if [ "$OPERATION" = "rename" ]; then
            if [ -z "$BASE_BRANCH" ] || [ "$BASE_BRANCH" = "$BRANCH_NAME" ]; then
              echo "::error::For 'rename', 'base_branch' holds the new branch name and must differ from 'branch_name'"
              exit 1
            fi
            # 'base_branch' is the new name; configure against the existing branch,
            # since the new one does not exist yet.
            EXTRA_ARGS="--new-branch-name=$BASE_BRANCH"
            BASE_BRANCH="$BRANCH_NAME"
          fi
          python git_operations.py "$OPERATION" "$BRANCH_NAME" \
            --base-branch="$BASE_BRANCH" \
            --branding="$BRANDING" \
            --branding-url="$BRANDING_URL" \
            --modules="$MODULES" \
            $EXTRA_ARGS 2>&1 | tee /tmp/git-ops.log

      - name: Operation Summary
        if: always()
        run: |
          {
            echo "## Git Operations Summary"
            echo "- **Operation**: ${{ inputs.operation }}"
            echo "- **Branch Name**: ${{ inputs.branch_name }}"
            if [ "${{ inputs.operation }}" = "rename" ]; then
              echo "- **New Branch Name**: ${{ inputs.base_branch }}"
            else
              echo "- **Base Branch**: ${{ inputs.base_branch }}"
            fi
            echo "- **Branding**: ${{ inputs.branding }}"
            echo "- **Modules**: ${{ inputs.modules }}"
            if [ -f /tmp/git-ops.log ]; then
              RESULTS=$(grep "Results:" /tmp/git-ops.log | tail -1 | sed 's/.*Results: //')
              if [ -n "$RESULTS" ]; then
                echo ""
                echo "**Results**: $RESULTS"
              fi
              CONFLICTS=$(grep "Conflicts" /tmp/git-ops.log | sed 's|.*in \([^ ]*\) (PR #\([0-9]*\)): \(.*\)|- [\1 (PR #\2)](\3)|')
              if [ -n "$CONFLICTS" ]; then
                echo ""
                echo "### Conflicts"
                echo "$CONFLICTS"
              fi
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"
